<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus360 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Campus360: navy + white + restrained gold, B-school calm. Layout: collapsible navy sidebar (desktop) / bottom tabs (mobile), cards on a cool-grey canvas. */
:root{
  --navy:#0b1a33; --navy-2:#16294a; --navy-3:#2a4270; --ink:#0d1b33; --muted:#5d6b82; --faint:#8a97ab;
  --line:#e2e7ef; --bg:#f3f5f9; --card:#ffffff; --tint:#edf1f8;
  --gold:#c49a2c; --gold-2:#e2c062; --gold-soft:#f8f0d9;
  --red:#c2362f; --red-soft:#fdeceb; --green:#1d8559; --green-soft:#e4f4ec; --amber:#a86a06; --amber-soft:#fff3d9; --blue:#2463a8; --blue-soft:#e6f0fb;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(11,26,51,.05),0 6px 20px rgba(11,26,51,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.sm{width:14px;height:14px}.ic.lg{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums}

/* banner */
.proto{background:var(--gold-soft);color:#6b5210;font-size:12px;padding:6px 16px;text-align:center;border-bottom:1px solid #efe0b3}
.proto b{font-weight:700}
.proto button{text-decoration:underline;font-weight:600;margin-left:6px}

/* shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:calc(100% - 29px)}
.shell.col{grid-template-columns:76px 1fr}
.side{position:sticky;top:0;height:100vh;background:var(--navy);color:#c6d0e2;display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand b{color:#fff;font-size:16px;letter-spacing:-.01em}.brand b span{color:var(--gold-2)}
.brand small{display:block;font-size:11px;color:#8090ad}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a,.nav button{position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;font-weight:500;color:#c6d0e2;text-align:left;width:100%}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.1);color:#fff}
.nav a.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--gold-2)}
.nav .cap{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6f80a0;padding:16px 12px 6px}
.nav .pill{margin-left:auto;background:var(--gold-2);color:var(--navy);font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
.shell.col .nav a span.l,.shell.col .brand div,.shell.col .nav .cap,.shell.col .nav .pill{display:none}
.shell.col .nav a,.shell.col .nav button{justify-content:center}
.foot{border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1140px;margin:0 auto;height:60px;display:flex;align-items:center;gap:12px;padding:0 20px}
.mbrand{display:none;align-items:center;gap:8px;font-weight:700}
.mbrand span{color:var(--gold)}
.sbtn{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--bg);border-radius:12px;color:var(--faint)}
.sbtn kbd{margin-left:auto;font:600 10px var(--body);border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 5px;color:var(--muted)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--navy-2)}
.iconbtn:hover{background:var(--tint)}
.dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--navy-3),var(--navy));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.av.lg{width:64px;height:64px;font-size:22px}
main .wrap{max-width:1140px;margin:0 auto;padding:22px 20px 120px}
.bnav{display:none;position:fixed;inset:auto 0 0 0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;font-size:10.5px;font-weight:600;color:var(--faint)}
.bnav .on{color:var(--navy)}
.bnav .ic{width:22px;height:22px}
@media (max-width:1023px){.shell,.shell.col{grid-template-columns:1fr}.side{display:none}.bnav{display:grid}.mbrand{display:flex}}
@media (max-width:640px){.sbtn span.t,.sbtn kbd{display:none}.sbtn{flex:0 0 40px;justify-content:center;padding:0}.top .in{justify-content:space-between}}

/* building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.ph h1{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.g2{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.main-side{display:grid;gap:20px;grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1023px){.main-side{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}.g4.keep{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sec h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.link{color:var(--navy-3);font-weight:600;font-size:13px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.xs{font-size:11px}
.b{font-weight:700}.sb{font-weight:600}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--navy);color:#fff;transition:transform .1s,background .15s;white-space:nowrap}
.btn:hover{background:var(--navy-2)}.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold);color:#fff}.btn.gold:hover{background:#b08a24}
.btn.out{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.out:hover{background:var(--tint)}
.btn.soft{background:var(--tint);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--navy-3)}
.btn.red{background:var(--red)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--tint);color:var(--navy-2);white-space:nowrap}
.badge.gold{background:var(--gold-soft);color:#7d5f10}.badge.red{background:var(--red-soft);color:var(--red)}.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}.badge.blue{background:var(--blue-soft);color:var(--blue)}.badge.dark{background:var(--navy);color:var(--gold-2)}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:inline-flex;background:#e7ebf2;border-radius:12px;padding:4px;gap:2px}
.seg button{padding:6px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .n{margin-left:6px;background:var(--gold);color:#fff;border-radius:99px;font-size:10px;padding:0 6px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .grow{margin-left:auto}

label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:400}
.inp:focus{outline:none;border-color:var(--navy-3);box-shadow:0 0 0 3px #dfe6f3}
select.inp{padding-right:30px}
textarea.inp{min-height:90px;resize:vertical}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.err{font-size:12px;color:var(--red);font-weight:600}
.form{display:flex;flex-direction:column;gap:14px}
.formrow{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:640px){.formrow{grid-template-columns:1fr}}

.empty{border:1px dashed #cfd7e4;border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.6)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* home */
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:22px;padding:26px 28px}
.hero::after{content:"";position:absolute;right:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(226,192,98,.28),transparent 65%)}
.hero h1{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.01em;margin-top:4px}
.hero .d{color:#9fb0cd;font-size:13px}
.hero .row{margin-top:14px;position:relative;z-index:1}
.hp{background:rgba(255,255,255,.1);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600}
.hp.g{background:var(--gold-2);color:var(--navy)}
.urgent{display:flex;gap:12px;align-items:flex-start;background:var(--red-soft);border:1px solid #f4c9c6;color:#7d1d18;border-radius:var(--r);padding:14px 16px;text-align:left;width:100%}
.urgent .ic{color:var(--red);margin-top:2px}
.short{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.short a{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--navy-2);text-align:center}
.short a span.i{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;transition:transform .15s}
.short a:hover span.i{transform:translateY(-2px)}
@media (max-width:640px){.short{display:flex;overflow-x:auto;scrollbar-width:none}.short a{flex:0 0 74px}}
.now{display:flex;align-items:center;gap:14px;padding:14px 16px;background:linear-gradient(90deg,var(--tint),#fff);border-bottom:1px solid var(--line)}
.now .k{font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px 8px;border-radius:8px;background:var(--navy);color:var(--gold-2)}
.now .k.live{background:var(--green);color:#fff}
.li{display:flex;align-items:center;gap:14px;padding:11px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{width:68px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--navy-3)}
.li.past{opacity:.5}
.strike{text-decoration:line-through}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.hscroll>*{flex:0 0 260px;scroll-snap-align:start}

/* event card */
.ev{display:flex;flex-direction:column;overflow:hidden;text-align:left;width:100%;height:100%;transition:transform .15s,box-shadow .15s}
.ev:hover,.hov:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(11,26,51,.12)}
.ev .art{position:relative;height:104px}
.ev .date{position:absolute;left:12px;top:12px;background:#fff;border-radius:10px;padding:4px 9px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.ev .date small{display:block;font-size:10px;font-weight:800;color:var(--red);letter-spacing:.05em}
.ev .date b{font-size:18px;line-height:1.1}
.ev .reg{position:absolute;right:10px;bottom:10px;background:#fff;color:var(--green);border-radius:99px;font-size:11px;font-weight:700;padding:3px 8px;display:flex;gap:4px;align-items:center}
.ev .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ev h3{font-size:15px;line-height:1.3}
.meta{display:flex;flex-direction:column;gap:3px;margin-top:auto;padding-top:6px;font-size:12px;color:var(--muted)}
.meta span{display:flex;align-items:center;gap:6px}
.bar{height:6px;border-radius:99px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy-3);border-radius:99px}

.cd{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--navy-3);white-space:nowrap}
.cd.hot{color:var(--red)}.cd.done{color:var(--faint)}

/* tiles */
.tile{aspect-ratio:4/3;display:grid;place-items:center;color:rgba(255,255,255,.9);position:relative}
.tile .ic{width:38px;height:38px;stroke-width:1.5}
.tile .tl{position:absolute;left:8px;top:8px;display:flex;gap:4px}
.heart{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--muted)}
.heart.on{color:var(--red)}.heart.on .ic{fill:var(--red)}

/* parcels */
.steps{display:flex;align-items:center;margin:4px 0}
.steps .s{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:#e4e9f1;color:var(--muted);flex-shrink:0}
.steps .s.on{background:var(--navy);color:#fff}
.steps .ln{flex:1;height:2px;background:#e4e9f1}.steps .ln.on{background:var(--navy)}
.steplbl{display:grid;grid-template-columns:repeat(5,1fr);font-size:10.5px;color:var(--muted);margin-top:6px}
.steplbl span:nth-child(n+2){text-align:center}.steplbl span:last-child{text-align:right}
.otp{display:flex;gap:16px;align-items:center;background:var(--gold-soft);border-top:1px solid #efdfae;padding:16px}
.otp .code{font-size:30px;font-weight:800;letter-spacing:.3em;font-variant-numeric:tabular-nums}
@media (max-width:520px){.otp{flex-direction:column;text-align:center}.steplbl{display:none}}

/* chat */
.chatwrap{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 200px);min-height:460px;overflow:hidden}
.chatlist{border-right:1px solid var(--line);overflow:auto}
.ci{display:flex;gap:10px;padding:14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.ci.on{background:var(--tint)}
.thread{display:flex;flex-direction:column;min-width:0}
.thead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:16px;background:#f7f9fc;display:flex;flex-direction:column;gap:6px}
.m{max-width:76%;padding:8px 12px;border-radius:16px;font-size:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05);align-self:flex-start;border-bottom-left-radius:5px}
.m.me{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.m small{display:block;font-size:10px;opacity:.6;text-align:right;margin-top:2px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
@media (min-width:761px){[data-a="closeThread"]{display:none}}
.typing{font-size:12px;color:var(--muted);font-style:italic}
@media (max-width:1023px){.chatwrap{height:calc(100dvh - 320px);min-height:380px}}
@media (max-width:760px){.chatwrap{grid-template-columns:1fr}.chatwrap.thread-open .chatlist{display:none}.chatwrap:not(.thread-open) .thread{display:none}}

/* notifications */
.nt{display:flex;gap:12px;padding:14px 16px;text-align:left;width:100%;border-radius:var(--r);background:#fff;border:1px solid var(--line)}
.nt.unread{border-left:4px solid var(--navy-3)}
.nt.urg{background:var(--red-soft);border-color:#f2c7c4}
.nt.imp{background:#fffaf0;border-color:#f0e2bd}
.nt .ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--navy-3);flex-shrink:0}
.nt.urg .ico{background:var(--red);color:#fff}.nt.imp .ico{background:var(--gold);color:#fff}

/* modal */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,16,34,.45);backdrop-filter:blur(2px)}
.md{background:#fff;border-radius:22px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease-out}
.md.wide{max-width:760px}
.md .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.md .mh h3{font-size:16px}
.md .mb{padding:18px 20px;overflow:auto}
.md .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
@media (max-width:640px){.ov{align-items:flex-end;padding:0}.md{border-radius:22px 22px 0 0;max-height:92vh}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.banner{position:relative;border-radius:18px;padding:22px;color:#fff;overflow:hidden}
.info{display:flex;gap:10px}
.info .bx{width:36px;height:36px;border-radius:11px;background:var(--tint);color:var(--navy-3);display:grid;place-items:center;flex-shrink:0}

.toastz{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;animation:pop .2s}
.toast .ic{color:var(--gold-2)}
@media (min-width:1024px){.toastz{bottom:28px}}

/* search */
.sres{display:flex;flex-direction:column;gap:2px}
.sres a,.sres button{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;text-align:left;width:100%}
.sres a:hover,.sres button:hover{background:var(--tint)}
.sgrp{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}

/* login */
.login{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100% - 29px)}
.lhero{background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lhero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(226,192,98,.22),transparent 65%)}
.lhero h1{font-family:var(--display);font-size:44px;line-height:1.08;margin-top:auto;max-width:460px}
.lhero h1 span{color:var(--gold-2)}
.lhero p{color:#a9b7d0;max-width:440px;font-size:15px}
.lfeat{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:460px;margin-top:22px}
.lfeat div{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:13px}
.lfeat .ic{color:var(--gold-2)}
.lform{display:flex;align-items:center;justify-content:center;padding:28px}
.lform>div{width:100%;max-width:380px}
.otpinp{font-size:22px;letter-spacing:.4em;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.demo-hint{background:var(--gold-soft);color:#6b5210;border-radius:10px;padding:8px 12px;font-size:12px}
@media (max-width:860px){.login{grid-template-columns:1fr}.lhero{display:none}}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);background:#fff}
.pick input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
.pick input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 14px;background:#f7f9fc}
table.t td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
.scrollx{overflow-x:auto}
.stat{display:flex;gap:12px;align-items:center;padding:16px}
.stat .bx{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--tint);color:var(--navy-3)}
.stat b{font-size:22px;display:block;line-height:1.1}
.hbar{display:flex;align-items:center;gap:12px;font-size:13px;margin-bottom:10px}
.hbar span:first-child{width:110px;color:var(--muted)}
.hbar .bar{flex:1;height:9px}
.hbar b{width:36px;text-align:right}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.toggle:first-child{border-top:0}
.sw{width:42px;height:24px;border-radius:99px;background:#cbd3df;position:relative;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--navy-3)}.sw.on::after{left:21px}
.daystrip{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.daystrip button{flex:0 0 58px;border-radius:16px;background:#fff;padding:8px 0;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line)}
.daystrip button small{font-size:11px;color:var(--muted);font-weight:600}
.daystrip button b{font-size:19px}
.daystrip button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.daystrip button.on small{color:#9fb0cd}
.daystrip button.today::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:2px}
.week{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;min-width:780px}
.wk{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;font-size:12px}
.wk.c{background:var(--red-soft);border-color:#f2c7c4}.wk.ch{background:var(--amber-soft);border-color:#f2deae}
.wk.live{box-shadow:0 0 0 2px var(--green)}
.whd{text-align:center;font-weight:700;font-size:13px;padding:8px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:8px}
.whd.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:12px;background:var(--tint);font-size:12px;font-weight:700;color:var(--muted);height:fit-content}
.vote.on{background:var(--navy);color:#fff}
.boards a{display:flex;gap:12px;align-items:flex-start;padding:16px}
.bico{width:42px;height:42px;border-radius:13px;background:var(--navy);color:var(--gold-2);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}

function sessions(from,to){
  var out=[];
  for(var off=from;off<=to;off++){
    var w=dow(off); if(w===0||w===6) continue;

      var c=COURSES[((off+100)*2+i)%6], id=off+'-'+i, o=S.tt[id]||{};

}

function qr(str,size){
  var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  function r(){h^=h<<13;h^=h>>>17;h^=h<<5;return (h>>>0)/4294967296;}
  var n=25,cells='';
  function fin(x,y){return '<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="#0b1a33"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="#0b1a33"/>';}
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){var inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);if(!inF&&r()>.52)cells+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';}
  return '<svg width="'+size+'" height="'+size+'" viewBox="-1 -1 '+(n+2)+' '+(n+2)+'" shape-rendering="crispEdges" style="background:#fff;border-radius:10px" role="img" aria-label="QR code"><g fill="#0b1a33">'+cells+'</g>'+fin(0,0)+fin(n-7,0)+fin(0,n-7)+'</svg>';
}

VIEW.timetable=function(){
  var v=S.ui.ttView,sel=Number(S.ui.ttDay),now=Date.now();
  var out=ph('Timetable','Batch '+S.user.batch+' · Section '+S.user.section+' · Times in IST');
  out+='<div class="toolbar">'+seg('ttView',[['day','Day'],['week','Week'],['changes','Changes']])+'</div>';
  if(v==='day'){
    var w0=sel-((dow(sel)+6)%7);
    out+='<div class="daystrip">';
    for(var i=0;i<7;i++){var o=w0+i;out+='<button class="'+(o===sel?'on ':'')+(o===0?'today':'')+'" data-a="set" data-k="ttDay" data-v="'+o+'"><small>'+fm({weekday:'short'}).format(at(o,12))+'</small><b>'+fDnum(at(o,12))+'</b></button>';}
    out+='</div><div class="stack">';

    list.forEach(function(s){var live=s.start<=now&&s.end>now&&s.status!=='cancelled';out+='<div class="card" style="display:flex;gap:16px;padding:14px 16px;'+(live?'box-shadow:0 0 0 2px var(--green);':'')+(s.end<now?'opacity:.55;':'')+(s.status==='cancelled'?'background:#fff8f7;':'')+'"><div style="width:74px;text-align:right;border-right:1px solid var(--line);padding-right:12px;flex-shrink:0"><div class="b">'+fTime(s.start)+'</div><div class="xs muted">'+fTime(s.end)+'</div></div><div style="flex:1;min-width:0"><div class="row" style="gap:6px">'+(live?'<span class="badge green">● Now</span>':'')+(s.status!=='scheduled'?'<span class="badge '+(s.status==='cancelled'?'red':'amber')+'">'+s.status+'</span>':'')+'</div><div class="b '+(s.status==='cancelled'?'strike':'')+'" style="font-size:15px;margin-top:2px">'+s.name+'</div><div class="row xs muted" style="gap:12px;margin-top:3px"><span>'+s.code+'</span><span class="row" style="gap:4px">'+I('pin','sm')+s.room+(s.origRoom?' <span class="strike faint">'+s.origRoom+'</span>':'')+'</span><span class="row" style="gap:4px">'+I('user','sm')+s.fac+'</span></div>'+(s.note?'<div class="small sb" style="color:var(--amber);margin-top:6px">'+esc(s.note)+'</div>':'')+'</div></div>';});
    out+='</div>';
  }else if(v==='week'){
    var m=0-((dow(0)+6)%7);
    out+='<div class="scrollx"><div class="week">';
    for(var d=0;d<5;d++){var off=m+d;var l=sessions(off,off);out+='<div><div class="whd '+(off===0?'on':'')+'">'+fDay(at(off,12))+'</div><div class="stack" style="gap:8px">'+l.map(function(s){var live=s.start<=now&&s.end>now;return '<div class="wk '+(s.status==='cancelled'?'c':s.status!=='scheduled'?'ch':'')+(live?' live':'')+'"><div class="b" style="color:var(--navy-3)">'+fTime(s.start)+'</div><div class="sb clamp2 '+(s.status==='cancelled'?'strike':'')+'">'+s.name+'</div><div class="muted">'+s.room+'</div>'+(s.status!=='scheduled'?'<div class="b" style="color:var(--amber);text-transform:capitalize;margin-top:2px">'+s.status+'</div>':'')+'</div>';}).join('')+'</div></div>';}
    out+='</div></div>';
  }else{
    var ch=sessions(0,14).filter(function(s){return s.status!=='scheduled';});
    out+=ch.length?'<div class="stack">'+ch.map(function(s){return '<div class="card pad" style="display:flex;gap:12px">'+'<span style="color:'+(s.status==='cancelled'?'var(--red)':'var(--amber)')+'">'+I('alert')+'</span><div><span class="badge '+(s.status==='cancelled'?'red':'amber')+'">'+s.status+'</span><div class="b" style="margin-top:4px">'+s.code+' · '+s.name+'</div><div class="small muted">'+fDT(s.start)+' · '+s.room+(s.origRoom?' (was '+s.origRoom+')':'')+'</div>'+(s.note?'<div class="small sb" style="color:var(--amber);margin-top:4px">'+esc(s.note)+'</div>':'')+'</div></div>';}).join('')+'</div>':empty('No timetable changes in the next two weeks');
  }
  return out;
};

function searchResults(q){
  q=q.trim().toLowerCase();
  if(q.length<2)return '<div class="sgrp">Go to</div><div class="sres">'+NAV.slice(0,8).map(function(n){return '<a href="#'+n[0]+'" data-a="go" data-v="'+n[0]+'">'+I(n[2],'sm')+n[1]+'</a>';}).join('')+'</div>';
  function has(s){return String(s||'').toLowerCase().indexOf(q)>=0;}
  var groups=[
    ['Events',S.events.filter(function(e){return has(e.title)||has(e.org)||has(e.venue);}).map(function(e){return ['event',e.id,e.title,fDay(e.start)+' · '+e.venue];})],
    ['Competitions',S.opps.filter(function(o){return has(o.title)||has(o.org);}).map(function(o){return ['opp',o.id,o.title,o.org];})],
    ['Marketplace',S.listings.filter(function(l){return has(l.title);}).map(function(l){return ['listing',l.id,l.title,l.type==='sell'?rupees(l.price):l.type];})],
    ['Lost & Found',S.lf.filter(function(i){return has(i.title)||has(i.loc);}).map(function(i){return ['lf',i.id,i.title,i.kind+' · '+i.loc];})],
    ['Courses & exams',COURSES.filter(function(c){return has(c[0])||has(c[1]);}).map(function(c){return ['go','timetable',c[0]+' · '+c[1],c[2]];}).concat(S.exams.filter(function(e){return has(e.title);}).map(function(e){return ['go','calendar',e.title,fDT(e.t)];}))],
    ['Announcements',S.ann.filter(function(a){return has(a.title)||has(a.body);}).map(function(a){return ['go','announcements',a.title,a.by];})],
    ['Community',S.posts.filter(function(p){return has(p.title);}).map(function(p){return ['post',p.id,p.title,p.tag];})]
  ].filter(function(g){return g[1].length;});
  if(!groups.length)return '<div class="muted" style="padding:20px;text-align:center">No results for “'+esc(q)+'”</div>';
  return groups.map(function(g){return '<div class="sgrp">'+g[0]+'</div><div class="sres">'+g[1].slice(0,5).map(function(r){return '<button data-a="'+r[0]+'" data-id="'+r[1]+'" data-v="'+r[1]+'"><div style="min-width:0"><div class="sb trunc">'+esc(r[2])+'</div><div class="xs muted trunc" style="text-transform:capitalize">'+esc(r[3])+'</div></div></button>';}).join('')+'</div>';}).join('');
}

function render(){
  var a=document.activeElement,id=a&&a.id,pos=a&&'selectionStart' in a?a.selectionStart:null;
  var html=!S.logged?loginView():!S.onboarded?onboardView():shell();
  document.getElementById('app').innerHTML='<div class="proto"><b>Prototype</b> · All names, events, companies and figures are sample data, not official IIM Raipur information.'+(S.logged?'<button data-a="reset">Reset demo</button>':'')+'</div>'+html;
  if(id){var el=document.getElementById(id);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(e){}}}
  var ms=document.getElementById('msgs');if(ms)ms.scrollTop=ms.scrollHeight;
}
function open(m){M=m;render();var q=document.getElementById('q');if(q)q.focus();}
function close(){M=null;render();}
function go(v){M=null;location.hash=v;if(view()===v)render();window.scrollTo(0,0);}

var F={
  email:function(fd){var e=String(fd.get('email')).trim().toLowerCase();if(!/@iimraipur\.ac\.in$/.test(e)){document.getElementById('lerr').textContent='Use your institute email (@iimraipur.ac.in).';return;}S.user.email=e;S.ui.loginStep='otp';render();var c=document.getElementById('code');if(c)c.focus();},
  otp:function(fd){if(String(fd.get('code')).trim()!=='123456'){document.getElementById('lerr').textContent='That code is incorrect. In this prototype, use 123456.';return;}S.logged=true;save();location.hash='home';render();window.scrollTo(0,0);},
  onboard:function(fd){var ints=fd.getAll('int');Object.assign(S.user,{name:fd.get('name')||S.user.name,program:fd.get('program'),batch:fd.get('batch'),section:fd.get('section'),hostel:fd.get('hostel'),interests:ints.length?ints:S.user.interests});S.boards[0].name='Batch '+S.user.batch.replace('-','–');S.onboarded=true;save();render();toast('Welcome to Campus360, '+S.user.name.split(' ')[0]+'!');},
  send:function(fd,f){var x=String(fd.get('x')||'').trim();if(!x)return;var c=S.convos.find(function(y){return y.id===S.ui.convo;});c.msgs.push({me:true,x:x,t:Date.now()});c.typing=true;save();render();
    setTimeout(function(){c.typing=false;var replies=['Sure! When would you like to meet?','Yes, still available. I’m in Block A after 6 pm.','Sounds good, see you then!','Let me check and get back to you in a bit.'];c.msgs.push({me:false,x:replies[c.msgs.length%replies.length],t:Date.now()});if(view()!=='messages'||S.ui.convo!==c.id)c.unread=(c.unread||0)+1;save();render();},1400);},
  parcel:function(fd){S.parcels.unshift({id:uid(),item:fd.get('item')||'Parcel',courier:fd.get('courier'),track:fd.get('track'),sender:fd.get('sender')||'Online order',st:0,otp:null,arrived:null,exp:at(3,12)});S.ui.pTab='active';save();close();toast('Parcel registered. You’ll be notified when it reaches campus.');},
  lfnew:function(fd,f){var txt=String(fd.get('title'))+' '+String(fd.get('desc'));if(/\d{9,}/.test(txt.replace(/[\s-]/g,''))){document.getElementById('lferr').textContent='Please remove ID, card or phone numbers. Owners can prove ownership privately.';return;}
    var kind=f.dataset.kind,item={id:uid(),kind:kind,title:fd.get('title'),cat:fd.get('cat'),loc:fd.get('loc'),t:Date.now(),desc:fd.get('desc')||'',by:S.user.name,status:'open'};S.lf.unshift(item);S.ui.lfTab='mine';
    var match=S.lf.find(function(i){return i!==item&&i.kind!==kind&&i.cat===item.cat&&i.status==='open';});
    if(match)notify({type:'lost_found',title:'Possible match for “'+item.title+'”',body:'A '+match.kind+' item in the same category: '+match.title+' ('+match.loc+')',pr:'important',go:'lost-found'});
    save();close();toast(match?'Posted. We found a possible match; check your notifications.':'Posted. We’ll alert you about possible matches.');},
  listing:function(fd){var type=fd.get('type');S.listings.unshift({id:uid(),title:fd.get('title'),cat:fd.get('cat'),type:type,price:type==='sell'?Number(fd.get('price'))||0:0,neg:!!fd.get('neg')&&type==='sell',cond:fd.get('cond'),seller:S.user.name,sbatch:S.user.batch,t:Date.now(),status:'available',wish:false,desc:fd.get('desc')||''});S.ui.mkTab='mine';save();close();toast('Listed! Buyers can now message you.');},
  offer:function(fd){var l=S.listings.find(function(x){return x.id===M.id;});toast('Offer of '+rupees(fd.get('amt'))+' sent to '+l.seller);close();},
  claim:function(fd){S.claims.push({item:M.id,msg:fd.get('msg'),status:'pending'});M.claim=false;save();toast('Claim sent. The finder will verify it.');render();},
  reply:function(fd){var p=S.posts.find(function(x){return x.id===M.id;});p.replies.push({by:S.user.name,x:fd.get('x'),t:Date.now()});save();render();},
  post:function(fd){S.posts.unshift({id:uid(),board:S.ui.board,title:fd.get('title'),body:fd.get('body')||'',tag:fd.get('tag'),by:S.user.name,t:Date.now(),votes:0,voted:false,replies:[]});save();close();toast('Posted to the board');},
  group:function(fd){S.boards.push({id:uid(),name:fd.get('name'),kind:'Interest groups',desc:fd.get('desc')||'New group',joined:true});save();close();toast('Group created');},
  team:function(fd,f){S.teams.unshift({id:uid(),opp:f.dataset.opp,name:fd.get('name'),owner:S.user.name,members:[S.user.name],max:Number(fd.get('max')),need:[],me:'member',desc:fd.get('desc')||''});save();M={t:'opp',id:f.dataset.opp};render();toast('Team created. Others can now request to join.');},
  opp:function(fd){var o={id:uid(),title:fd.get('title'),org:fd.get('org'),cat:fd.get('cat'),type:fd.get('type'),prize:fd.get('prize')||'—',team:fd.get('team')||'—',reg:Date.now()+Number(fd.get('days'))*D,sub:null,ok:S.role==='admin',saved:false,elig:'See organiser page',desc:'Submitted via Campus360.'};S.opps.push(o);save();close();toast(o.ok?'Published to all students':'Submitted. An admin will verify it shortly.');},
  event:function(fd,f){var day=Number(fd.get('day')),cap=Number(fd.get('cap'))||null;var e={id:uid(),title:fd.get('title'),cat:fd.get('cat'),start:at(day,18),end:at(day,20),venue:fd.get('venue')||'Auditorium',org:'Student Council',cap:cap,reg:0,wait:0,me:null,desc:fd.get('desc')||'New event.'};S.events.push(e);notify({type:'events',title:'New event: '+e.title,body:fDT(e.start)+' · '+e.venue,pr:'normal',go:'events'});save();M=null;f.reset();toast('Event published. Students have been notified.');render();},
  ann:function(fd,f){var a={id:uid(),title:fd.get('title'),body:fd.get('body'),cat:fd.get('cat'),pr:fd.get('pr'),pin:false,official:!!fd.get('official'),by:'Academic Office',t:Date.now()};S.ann.unshift(a);notify({type:'announcements',title:(a.pr==='urgent'?'URGENT: ':'')+a.title,body:a.body,pr:a.pr,go:'announcements'});save();M=null;f.reset();toast('Announcement published and students notified');render();},
  verify:function(fd,f){var code=String(fd.get('otp')).trim();var all=S.deskParcels.concat(S.parcels);var p=all.find(function(x){return x.st===3&&x.otp===code;});if(!p){toast('Incorrect OTP. No parcel is waiting with that code.');return;}p.st=4;p.otp=null;if(S.parcels.indexOf(p)>=0)notify({type:'parcels',title:'Parcel collected: '+p.item,body:p.courier+' · '+p.track,pr:'normal',go:'parcels'});save();toast('OTP verified. Parcel handed over.');render();}
};

/* ---------------------------------------------------------------- wiring */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');
  if(!el)return;
  if(el.classList.contains('ov')&&e.target.closest('[data-stop]'))return;
  var fn=A[el.dataset.a];if(!fn)return;
  e.preventDefault();
  if(el.dataset.a==='ttchanges'){A.ttchanges();go('timetable');return;}
  fn(el.dataset,el);
});
document.addEventListener('submit',function(e){var f=e.target;if(f.dataset.f&&F[f.dataset.f]){e.preventDefault();F[f.dataset.f](new FormData(f),f);}});
document.addEventListener('change',function(e){var b=e.target.dataset&&e.target.dataset.bind;if(b){S.ui[b]=e.target.value;save();render();}});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.ui.q=e.target.value;document.getElementById('sres').innerHTML=searchResults(e.target.value);}});
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&S.logged&&S.onboarded){e.preventDefault();open({t:'search'});}
  if(e.key==='Escape'&&M)close();
});
window.addEventListener('hashchange',function(){M=null;render();window.scrollTo(0,0);});
setInterval(function(){document.querySelectorAll('.cd[data-t]').forEach(function(s){var t=Number(s.dataset.t);s.lastChild.textContent=(s.dataset.pre||'')+cdl(t);});},30000);
